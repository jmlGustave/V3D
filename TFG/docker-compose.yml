version: '3.8'

services:
  isaac_sim:
    image: nvcr.io/nvidia/isaac-sim:6.2.0.1
    container_name: tfg_isaac_sim
    network_mode: "host"
    entrypoint: /bin/bash
    command: -c "tail -f /dev/null"
    environment:
      - DISPLAY=${DISPLAY}
      - ACCEPT_EULA=Y
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./escenarios_isaac:/isaac-workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video, utility, graphics, display]

  
  ros2_workspace:
    image: osrf/ros:humble-desktop
    container_name: tfg_ros2_core
    network_mode: "host"
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./workspace_ros2:/colcon_ws
    command: /bin/bash -c "source /opt/ros/humble/setup.bash && tail -f /dev/null"
